<style>
/* Layout: sala de controle; faixa de agentes no topo, abas de trabalho embaixo */
:root{

  --accent:#6147EC; --accent-soft:#EEEBFF; --blue:#2961EB;
  --ok:#1F8A5B; --ok-soft:#E3F4EC; --warn:#B26A00; --warn-soft:#FFF2DC; --bad:#C2334D; --bad-soft:#FDE7EB; --idle:#8A90AD;

  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1230; --surface:#161B3F; --ink:#E9EBFA; --muted:#A3A8C8; --line:#2A3060;
  --accent:#9C8CFF; --accent-soft:#2A2560; --blue:#7FA2FF;
  --ok:#5CD39B; --ok-soft:#16382C; --warn:#F2B45A; --warn-soft:#3A2C12; --bad:#FF7F96; --bad-soft:#3E1A26; --idle:#7A80A3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1230; --surface:#161B3F; --ink:#E9EBFA; --muted:#A3A8C8; --line:#2A3060;
  --accent:#9C8CFF; --accent-soft:#2A2560; --blue:#7FA2FF;
  --ok:#5CD39B; --ok-soft:#16382C; --warn:#F2B45A; --warn-soft:#3A2C12; --bad:#FF7F96; --bad-soft:#3E1A26; --idle:#7A80A3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stamp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:700}
.groups{display:grid;gap:18px}
.group-title{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.agent{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.agent:hover,.agent:focus-visible{border-color:var(--accent);outline:none}
.agent[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.agent .top{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)}.dot.atencao{background:var(--warn)}.dot.urgente,.dot.falhou{background:var(--bad)}.dot.sem_novidade{background:var(--blue)}
.agent b{font-size:14px}
.agent .when{font-size:12px;color:var(--muted)}
.agent .last{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.agent .who{display:flex;gap:10px;align-items:center;min-width:0}
.agent .who>div{display:grid;gap:1px;min-width:0}
.agent .role{font-size:12px;color:var(--muted)}
.agent .status{display:flex;align-items:center;gap:6px;margin-top:4px}
.av{flex:none;display:block;border-radius:50%;overflow:hidden}
.av svg{display:block;width:100%;height:100%}
.subs-mini{display:flex;margin-left:auto}
.subs-mini .av{border:2px solid var(--surface);margin-left:-8px}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.ficha h3{font-size:20px}
.ficha .cargo{color:var(--accent);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.ficha .rotina{font-size:13px;color:var(--muted)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:4px}
.sub-card{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.sub-card div{display:grid;gap:2px;min-width:0}
.sub-card b{font-size:13px}
.sub-card span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.ficha{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:600 14px var(--f-display);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 7px;margin-left:6px}
.panel{display:grid;gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font:500 12px var(--f-display);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.card.urgente{border-left:4px solid var(--bad)}.card.atencao{border-left:4px solid var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.atencao,.pill.pendente,.pill.novo{background:var(--warn-soft);color:var(--warn)}.pill.urgente,.pill.falhou,.pill.critica,.pill.recusado{background:var(--bad-soft);color:var(--bad)}.pill.lead,.pill.aprovado,.pill.feito,.pill.encaminhado,.pill.concluido{background:var(--ok-soft);color:var(--ok)}
.card h3{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.card p{margin:0;max-width:75ch}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
ul.items{margin:8px 0 0;padding-left:18px;display:grid;gap:8px}
ul.items li{max-width:80ch}
.items .t{font-weight:600}
.items .s{font-size:12px;color:var(--muted)}
a{color:var(--blue)}
.acoes{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.acoes b{display:block;margin-bottom:4px}
.acoes ul{margin:0;padding-left:18px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font:600 13px var(--f-display);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
